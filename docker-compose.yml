version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: story_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aivoice}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: story_redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: story_api
    restart: always
    # Removed --reload to avoid filesystem scanning of mounted venv (memory error).
    # Use --reload only for local dev outside of the container.
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/aivoice}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey_change_in_production}
      - PIPER_USE_DOCKER=${PIPER_USE_DOCKER:-0}
      - PIPER_DOCKER_CONTAINER=${PIPER_DOCKER_CONTAINER:-piper}
    volumes:
      - ./models:/models
      - ./media:/app/media

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: story_worker
    command: celery -A worker.celery_app worker --loglevel=info
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/aivoice}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: story_web
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - api

  piper:
    build:
      context: .
      dockerfile: docker/piper/Dockerfile
    image: ai-voice-storytelling-piper:latest
    container_name: piper
    restart: unless-stopped
    volumes:
      - ./models:/models
      - ./media:/media
    command: tail -f /dev/null
    healthcheck:
      test: ["CMD", "python", "-m", "piper", "-h"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
