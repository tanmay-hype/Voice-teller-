version: '3.8'

# Development override: mounts local source into containers and enables reload.
# Use together with the main docker-compose.yml for local development:
# docker-compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  api:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    volumes:
      - ./backend:/app:cached

  worker:
    volumes:
      - ./backend:/app:cached
