version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: story_db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aivoice}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: story_redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis_data:/data

  piper:
    build:
      context: .
      dockerfile: docker/piper/Dockerfile
    image: ai-voice-storytelling-piper:latest
    container_name: piper
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PIPER_HOST: 0.0.0.0
      PIPER_PORT: 8080
      PIPER_MODEL_PATH: /models/en_US-amy-medium.onnx
      PIPER_CONFIG_PATH: /models/en_US-amy-medium.onnx.json
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: story_api
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - piper
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/aivoice}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey_change_in_production}
      PIPER_MODEL_PATH: /models/en_US-amy-medium.onnx
      PIPER_CONFIG_PATH: /models/en_US-amy-medium.onnx.json
      PIPER_SERVICE_URL: http://piper:8080
      AUDIO_STORAGE_PROVIDER: ${AUDIO_STORAGE_PROVIDER:-supabase}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-story-audio}
    volumes:
      - media_data:/app/media

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: story_worker
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: celery -A worker.celery_app worker --loglevel=info
    depends_on:
      - db
      - redis
      - piper
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/aivoice}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      AUDIO_STORAGE_PROVIDER: ${AUDIO_STORAGE_PROVIDER:-supabase}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-story-audio}
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  redis_data:
  media_data: