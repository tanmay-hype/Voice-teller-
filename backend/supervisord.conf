[supervisord]
user=root
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:api]
command=sh -c "uvicorn main:app --host 0.0.0.0 --port ${PORT:-10000}"
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/api.err.log
stdout_logfile=/var/log/api.out.log
environment=PYTHONUNBUFFERED=1

[program:redis]
command=redis-server --bind 127.0.0.1 --protected-mode yes
autostart=true
autorestart=true
stderr_logfile=/var/log/redis.err.log
stdout_logfile=/var/log/redis.out.log

[program:celery_worker]
command=celery -A worker.celery_app:celery_app worker --loglevel=info
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/celery.err.log
stdout_logfile=/var/log/celery.out.log
environment=PYTHONUNBUFFERED=1,PYTHONPATH=/app